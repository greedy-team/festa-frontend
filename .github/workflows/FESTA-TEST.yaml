# ===================================================================
# 유닛테스트 (PR 검증)
# ===================================================================
#
# ⚠️ 파일명에 PROJECT- 접두어를 쓰지 않습니다.
#   .github/workflows/PROJECT-* 는 `npx projectops` 업데이트에 덮어써집니다 (DOC-0003).
#   PROJECT-REACT-CI.yaml(빌드 검증)이 이미 그 대상이라, 테스트 단계를 거기 끼워
#   넣는 대신 별도 파일로 분리해 덮어쓰기에서 안전하게 뒀다.
# ===================================================================

name: FESTA-TEST

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 유닛테스트
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 테스트
        run: pnpm test
